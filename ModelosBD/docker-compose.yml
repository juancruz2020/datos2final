
services:

  mongodb:
    image: mongo:8
    container_name: datos2-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongodb_data:/data/db

  # Inicializa el replica set solo si hace falta.
  mongodb-init:
    image: mongo:8
    restart: "no"
    network_mode: "service:mongodb"
    depends_on:
      mongodb:
        condition: service_started
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e

        echo "Esperando a MongoDB..."

        until mongosh --quiet --host localhost:27017 \
          --eval 'db.adminCommand({ping: 1})' > /dev/null 2>&1
        do
          sleep 2
        done

        echo "Comprobando replica set..."

        mongosh --quiet --host localhost:27017 --eval '
          try {
            rs.status();
            print("Replica set ya inicializado");
          } catch (e) {
            if (e.codeName === "NotYetInitialized") {
              rs.initiate({
                _id: "rs0",
                members: [
                  { _id: 0, host: "localhost:27017" }
                ]
              });
              print("Replica set inicializado");
            } else {
              throw e;
            }
          }
        '

        echo "Esperando al nodo PRIMARY..."

        until mongosh --quiet --host localhost:27017 \
          --eval 'if (!db.hello().isWritablePrimary) quit(1)' \
          > /dev/null 2>&1
        do
          sleep 2
        done

        echo "MongoDB replica set listo"

  cassandra:
    image: cassandra:5.0
    container_name: datos2-cassandra
    restart: unless-stopped
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: datos2
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: SimpleSnitch

  neo4j:
    image: neo4j:5
    container_name: datos2-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/tu_password
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  redis:
    image: redis:7
    container_name: datos2-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass TuPasswordRedis123
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
  cassandra_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
