<text x="1264" y="344" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">K    sensor_id: text</text>
<text x="1264" y="387" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">C↓  fecha_hora: timestamp</text>
<text x="1264" y="430" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">contenedor_id: text</text>
<text x="1264" y="473" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">latitud, longitud: decimal</text>
<text x="1264" y="516" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">pais, region: text</text>
<text x="1264" y="559" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">Q3: GPS por sensor en [inicio UTC, día siguiente)</text>
<text x="1264" y="602" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">La partición abarca todos los días del sensor.</text>
<text x="1264" y="645" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">La tabla no incluye fecha_dia.</text>
