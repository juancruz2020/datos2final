<text x="104" y="1054" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">K    region: text</text>
<text x="104" y="1097" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">C↓  fecha_dia: date</text>
<text x="104" y="1140" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">temperatura_min, temperatura_max: decimal</text>
<text x="104" y="1183" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">humedad_promedio: decimal</text>
<text x="104" y="1226" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">cantidad_lecturas: bigint</text>
<text x="104" y="1269" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">Q4: métricas por región y rango de días</text>
<rect x="1240" y="960" width="1080" height="430" rx="16" fill="#f7f9fc" stroke="#b8c6d3" stroke-width="2"/>
<rect x="1241" y="961" width="1078" height="68" rx="14" fill="#235c9e" stroke="#235c9e" stroke-width="2"/>
<rect x="1241" y="1000" width="1078" height="29" rx="0" fill="#235c9e" stroke="#235c9e" stroke-width="2"/>
<text x="1262" y="979" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="white">metricas_iot_pais_dia</text>
<text x="1264" y="1054" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">K    pais: text</text>
<text x="1264" y="1097" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">C↓  fecha_dia: date</text>
<text x="1264" y="1140" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">humedad_promedio: decimal</text>
<text x="1264" y="1183" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">temperatura_promedio: decimal</text>
<text x="1264" y="1226" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">cantidad_lecturas: bigint</text>
<text x="1264" y="1269" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">Q5: métricas por país y rango de días</text>
<rect x="80" y="1450" width="720" height="300" rx="16" fill="#f7f9fc" stroke="#b8c6d3" stroke-width="2"/>
<rect x="81" y="1451" width="718" height="68" rx="14" fill="#087d78" stroke="#087d78" stroke-width="2"/>
<rect x="81" y="1490" width="718" height="29" rx="0" fill="#087d78" stroke="#087d78" stroke-width="2"/>
<text x="102" y="1469" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="white">alertas</text>
<text x="104" y="1544" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">K    id: text</text>
<text x="104" y="1587" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">nombre, descripcion: text</text>
<text x="104" y="1630" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">Q6: listar catálogo de tipos de alerta</text>
<text x="104" y="1673" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">Catálogo independiente del monitoreo.</text>
<text x="870" y="1460" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#235c9e">ESCRITURA DEL MONITOREO</text>
<text x="870" y="1520" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#18304e">Un batch LOGGED agrupa lectura, posición y las dos métricas.</text>
<text x="870" y="1565" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#18304e">Los agregados se calculan con lecturas previas al batch.</text>
<text x="870" y="1610" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#18304e">Sin aislamiento para ese cálculo: pueden perderse actualizaciones</text>
<text x="870" y="1655" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#18304e">concurrentes o contarse dos veces las lecturas reinsertadas.</text>
<text x="80" y="1805" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#18304e">Sin claves foráneas, índices secundarios ni TTL en el DDL. Las vistas también ejecutan SELECT sin filtro.</text>
<text x="80" y="1850" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#50647a">Fuentes: CrearTablasMonitoreo, CrearTablaAlertas, ConsultasCassandraMonitoreo y AlertasCassandraDAO.</text>
</svg>