<text x="120" y="60" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="52" font-weight="700" fill="#18304e">Cassandra · Modelo físico orientado a consultas</text>
<text x="120" y="132" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#50647a">Keyspace logistica · K = partición · C↓ = clustering DESC · columnas sin marca = datos.</text>
<text x="2043.046875" y="190" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#50647a">DATOS2FINAL · 01/11/2026</text>
