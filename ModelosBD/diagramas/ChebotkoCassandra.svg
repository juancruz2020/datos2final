<text x="104" y="473" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">contenedor_id: text</text>
<text x="104" y="516" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">temperatura, humedad, vibracion: decimal</text>
<text x="104" y="559" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">latitud, longitud, bateria: decimal</text>
<text x="104" y="602" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">pais, region: text</text>
<text x="104" y="645" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">Q1: historial por sensor y día; intervalo horario</text>
<text x="104" y="688" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">Q2: temperatura y batería por sensor y día</text>
