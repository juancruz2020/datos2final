<rect x="81" y="1351" width="1038" height="68" rx="14" fill="#235c9e" stroke="#235c9e" stroke-width="2"/>
<rect x="81" y="1390" width="1038" height="29" rx="0" fill="#235c9e" stroke="#235c9e" stroke-width="2"/>
<text x="102" y="1369" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="white">lecturas_sensor · Cassandra</text>
<text x="104" y="1444" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">PK: ((sensor_id, fecha_dia), fecha_hora)</text>
<text x="104" y="1487" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">Registro completo de monitoreo.</text>
<text x="104" y="1530" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">Historial por sensor, día y hora.</text>
<rect x="1280" y="1350" width="1040" height="270" rx="16" fill="#f7f9fc" stroke="#b8c6d3" stroke-width="2"/>
<rect x="1281" y="1351" width="1038" height="68" rx="14" fill="#235c9e" stroke="#235c9e" stroke-width="2"/>
<rect x="1281" y="1390" width="1038" height="29" rx="0" fill="#235c9e" stroke="#235c9e" stroke-width="2"/>
<text x="1302" y="1369" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="white">posiciones_sensor · Cassandra</text>
<text x="1304" y="1444" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">PK: ((sensor_id), fecha_hora)</text>
<text x="1304" y="1487" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">Proyección GPS: coordenadas, país y región.</text>
<text x="1304" y="1530" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">Conserva sensor_id y contenedor_id.</text>
