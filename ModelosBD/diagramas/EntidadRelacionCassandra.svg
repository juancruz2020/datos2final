<rect x="1671.5" y="1213" width="237.0" height="43" rx="5" fill="white" stroke="white" stroke-width="2"/>
<text x="1683.5" y="1220" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#18304e">Proyección GPS</text>
<text x="80" y="1670" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#18304e">Las flechas discontinuas indican referencias lógicas; no hay claves foráneas entre motores.</text>
<text x="80" y="1715" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#18304e">El servicio exige IDs no vacíos; no comprueba su existencia ni la asociación sensor–contenedor en MongoDB.</text>
<text x="80" y="1760" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#18304e">País y región son dimensiones de métricas, sin tablas maestras propias en Cassandra. Ver ChebotkoCassandra.</text>
</svg>