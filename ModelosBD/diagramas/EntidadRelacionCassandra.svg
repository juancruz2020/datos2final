<text x="582" y="839" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="white">Lectura IoT · registro conceptual</text>
<text x="584" y="914" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">sensor_id, contenedor_id: texto de los ObjectId MongoDB</text>
<text x="584" y="957" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">fecha_dia: date · fecha_hora: timestamp</text>
<text x="584" y="1000" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">temperatura, humedad, vibracion, bateria: decimal</text>
<text x="584" y="1043" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">latitud, longitud: decimal · pais, region: text</text>
<text x="584" y="1086" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#18304e">Una lectura produce dos registros y actualiza dos agregados.</text>
