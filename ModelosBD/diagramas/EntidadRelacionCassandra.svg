<text x="120" y="60" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="52" font-weight="700" fill="#18304e">Monitoreo · Entidades y referencias entre motores</text>
<text x="120" y="132" dominant-baseline="text-before-edge" font-family="Arial, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#50647a">Vista conceptual: maestros MongoDB, referencias por identificador y proyecciones físicas en Cassandra.</text>
